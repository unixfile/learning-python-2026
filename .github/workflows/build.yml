name: Build slides

on:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Dockerfile changes
        id: changed
        run: |
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null &&
             git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- Dockerfile; then
            echo "dockerfile=false" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: steps.changed.outputs.dockerfile == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.changed.outputs.dockerfile == 'true'
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  build:
    needs: image
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository }}:latest

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true
